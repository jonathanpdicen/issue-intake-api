name: 'issue-intake-api'
recipe: laravel
proxy:
  appserver_nginx:
    - "issueintake.test"
services:
  appserver:
    build_as_root:
      - curl -sL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get update -y
      - apt-get install -y nodejs
  database:
    portforward: 33067
tooling:
  node:
    service: appserver
  npm:
    service: appserver
config:
  php: '8.4'
  composer_version: 2
  via: nginx
  webroot: public
  database: mysql:8.0
  xdebug: false
